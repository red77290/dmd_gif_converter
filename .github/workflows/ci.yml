name: CI — Headless Library, Tests & Package Build

on:
  push:
    branches: [main, develop, "feat/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

jobs:
  headless-library-and-engine-tests:
    name: Headless Core & Engine Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install headless package and test dependencies (Zero GUI / Zero X11)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify headless library import and GUI isolation
        run: |
          python -c "import dmd_gif_converter; assert bool(dmd_gif_converter.__version__)"
          pytest tests/engine/test_headless_api.py

      - name: Run full headless engine, converter & auto-action test suites
        run: |
          pytest tests/engine tests/converter tests/auto_action -k "not test_use_cases"

  build-wheel:
    name: Build & Verify Wheel Distribution
    runs-on: ubuntu-latest
    needs: headless-library-and-engine-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify wheel size (< 5 MB, no media bloat) and clean install
        run: |
          ls -lh dist/
          python -m venv /tmp/clean_venv
          /tmp/clean_venv/bin/pip install dist/*.whl
          /tmp/clean_venv/bin/python -c "from dmd_gif_converter import DmdMediaProcessor, DmdClipConfig, __version__; print('Installed version:', __version__)"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmd-gif-converter-dist
          path: dist/

      - name: Publish / Update SNAPSHOT Pre-Release on GitHub
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: SNAPSHOT
          name: "SNAPSHOT (Latest CI Build — ${{ github.ref_name }})"
          body: |
            Automated SNAPSHOT pre-release built from branch `${{ github.ref_name }}` (commit `${{ github.sha }}`).

            ### Install this SNAPSHOT wheel directly:
            ```bash
            pip install "git+https://github.com/${{ github.repository }}.git@${{ github.sha }}"
            ```
          prerelease: true
          files: |
            dist/*.whl
            dist/*.tar.gz

