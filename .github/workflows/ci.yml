name: CI — Headless Library, Tests & Package Build

on:
  push:
    branches: [main, develop, "feat/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  headless-library-and-engine-tests:
    name: Headless Core & Engine Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install headless package and test dependencies (Zero GUI / Zero X11)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify headless library import and GUI isolation
        run: |
          python -c "import dmd_gif_converter; assert bool(dmd_gif_converter.__version__)"
          pytest tests/engine/test_headless_api.py

      - name: Run full headless engine, converter & auto-action test suites
        run: |
          pytest tests/engine tests/converter tests/auto_action -k "not test_use_cases"

  build-wheel:
    name: Build & Verify Wheel Distribution
    runs-on: ubuntu-latest
    needs: headless-library-and-engine-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify wheel size (< 5 MB, no media bloat) and clean install
        run: |
          ls -lh dist/
          python -m venv /tmp/clean_venv
          /tmp/clean_venv/bin/pip install dist/*.whl
          /tmp/clean_venv/bin/python -c "from dmd_gif_converter import DmdMediaProcessor, DmdClipConfig, __version__; print('Installed version:', __version__)"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmd-gif-converter-dist
          path: |
            dist/*.whl
            dist/*.tar.gz

  build-desktop-ui:
    name: Build Standalone Desktop UI (${{ matrix.label }})
    needs: headless-library-and-engine-tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64 .exe
            artifact_name: dmd-gif-converter-ui-windows-x64
            asset_path: dist/desktop/DMD_GIF_Converter_Windows_x64.exe
          - os: macos-15
            label: macOS arm64 .dmg
            artifact_name: dmd-gif-converter-ui-macos-arm64
            asset_path: dist/desktop/DMD_GIF_Converter_macOS_arm64.dmg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Provision portable FFmpeg & FFprobe (macOS)
        if: runner.os == 'macOS'
        run: |
          which ffmpeg && which ffprobe || brew install ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Provision portable static FFmpeg & FFprobe (Windows x64)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $ffRoot = Join-Path $env:RUNNER_TEMP "ffmpeg-portable"
          $ffZip = Join-Path $env:RUNNER_TEMP "ffmpeg-win64-static.zip"
          $ffBin = Join-Path $ffRoot "bin"
          New-Item -ItemType Directory -Force -Path $ffBin | Out-Null

          $mirrors = @(
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-8.1.zip",
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip",
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          )

          $downloaded = $false
          foreach ($url in $mirrors) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Write-Host "[FFMPEG] Downloading portable static Windows x64 archive from $url (attempt $attempt/3)..."
                $headers = @{ "User-Agent" = "dmd-gif-converter-ci" }
                if ($url -like "https://github.com/*" -and $env:GH_TOKEN) {
                  $headers["Authorization"] = "Bearer $env:GH_TOKEN"
                }
                Invoke-WebRequest -Uri $url -Headers $headers -OutFile $ffZip -TimeoutSec 120 -MaximumRetryCount 2 -RetryIntervalSec 3
                if ((Test-Path $ffZip) -and ((Get-Item $ffZip).Length -gt 10000000)) {
                  $downloaded = $true
                  break
                }
              } catch {
                Write-Warning "[FFMPEG] Mirror attempt $attempt failed for ${url}: $($_.Exception.Message)"
                Start-Sleep -Seconds (3 * $attempt)
              }
            }
            if ($downloaded) { break }
          }

          if ($downloaded) {
            $extractDir = Join-Path $ffRoot "extracted"
            if (Test-Path $extractDir) { Remove-Item -Recurse -Force $extractDir }
            Expand-Archive -Path $ffZip -DestinationPath $extractDir -Force
            $ffmpegExe = Get-ChildItem -Path $extractDir -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
            $ffprobeExe = Get-ChildItem -Path $extractDir -Filter "ffprobe.exe" -Recurse | Select-Object -First 1
            if (-not $ffmpegExe -or -not $ffprobeExe) {
              throw "Extracted FFmpeg archive did not contain both ffmpeg.exe and ffprobe.exe"
            }
            Copy-Item -Path $ffmpegExe.FullName -Destination (Join-Path $ffBin "ffmpeg.exe") -Force
            Copy-Item -Path $ffprobeExe.FullName -Destination (Join-Path $ffBin "ffprobe.exe") -Force
            Remove-Item -Force $ffZip -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force $extractDir -ErrorAction SilentlyContinue
            "$ffBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:PATH = "$ffBin;$env:PATH"
          } elseif (-not ((Get-Command ffmpeg -ErrorAction SilentlyContinue) -and (Get-Command ffprobe -ErrorAction SilentlyContinue))) {
            Write-Warning "[FFMPEG] Static mirrors unavailable; falling back to Chocolatey..."
            choco install ffmpeg -y --no-progress --execution-timeout=180
          }
          ffmpeg -version
          ffprobe -version

      - name: Install UI & PyInstaller build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install ".[ui]" pyinstaller certifi

      - name: Build standalone Desktop UI & run hermetic out-of-the-box self-test
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          python .github/scripts/build_desktop_ui.py --self-test

      - name: Upload standalone Desktop UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: ${{ matrix.asset_path }}

  publish-snapshot:
    name: Publish / Update SNAPSHOT Pre-Release
    if: github.event_name == 'push'
    needs: [build-wheel, build-desktop-ui]
    runs-on: ubuntu-latest
    steps:
      - name: Download Python wheel & sdist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dmd-gif-converter-dist
          path: dist/

      - name: Download standalone Desktop UI artifacts (.exe & .dmg)
        uses: actions/download-artifact@v4
        with:
          pattern: dmd-gif-converter-ui-*
          merge-multiple: true
          path: dist/desktop/

      - name: Publish / Update SNAPSHOT Pre-Release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: SNAPSHOT
          name: "SNAPSHOT (Latest CI Build — ${{ github.ref_name }})"
          body: |
            Automated SNAPSHOT pre-release built from branch `${{ github.ref_name }}` (commit `${{ github.sha }}`).

            ### Standalone Desktop UI (Out-of-the-Box — Portable FFmpeg & AI Included)
            - **Windows (x64)**: `DMD_GIF_Converter_Windows_x64.exe` (single-file portable `.exe`, no Python or FFmpeg installation required)
            - **macOS (Apple Silicon `arm64`)**: `DMD_GIF_Converter_macOS_arm64.dmg` (`DMD GIF Converter.app`, drag-and-drop installer with bundled FFmpeg)

            ### Install Headless Python Library Directly:
            ```bash
            pip install "git+https://github.com/${{ github.repository }}.git@${{ github.sha }}"
            ```
          prerelease: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/desktop/*.exe
            dist/desktop/*.dmg
