name: Release — Build Wheel & Publish GitHub Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-desktop-ui:
    name: Build Standalone Desktop UI (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64 .exe
            artifact_name: dmd-gif-converter-ui-windows-x64
            asset_path: dist/desktop/DMD_GIF_Converter_Windows_x64.exe
          - os: macos-15
            label: macOS arm64 .dmg
            artifact_name: dmd-gif-converter-ui-macos-arm64
            asset_path: dist/desktop/DMD_GIF_Converter_macOS_arm64.dmg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Stamp package version from Git release tag
        shell: bash
        run: |
          python - <<'PY'
          import os, re, tomllib
          from pathlib import Path

          ver = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          targets = [
              ("pyproject.toml", r'^version = ".*"', f'version = "{ver}"'),
              ("src/engine/api.py", r'^__version__ = ".*"', f'__version__ = "{ver}"'),
              ("src/ui/constants.py", r'^APP_VERSION\s*=\s*".*"', f'APP_VERSION   = "{ver}"'),
              ("src/ui/models/application_state.py", r'^APP_VERSION\s*=\s*".*"', f'APP_VERSION = "{ver}"'),
          ]
          for rel_path, pattern, repl in targets:
              path = Path(rel_path)
              if path.exists():
                  path.write_text(
                      re.sub(pattern, repl, path.read_text(encoding="utf-8"), count=1, flags=re.M),
                      encoding="utf-8",
                  )

          toml_ver = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          assert toml_ver == ver, f"Version stamp mismatch: expected {ver}, got {toml_ver}"
          print(f"Stamped desktop UI build version: {ver}")
          PY

      - name: Provision portable FFmpeg & FFprobe (macOS)
        if: runner.os == 'macOS'
        run: |
          which ffmpeg && which ffprobe || brew install ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Provision portable static FFmpeg & FFprobe (Windows x64)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $ffRoot = Join-Path $env:RUNNER_TEMP "ffmpeg-portable"
          $ffZip = Join-Path $env:RUNNER_TEMP "ffmpeg-win64-static.zip"
          $ffBin = Join-Path $ffRoot "bin"
          New-Item -ItemType Directory -Force -Path $ffBin | Out-Null

          $mirrors = @(
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip",
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          )

          $downloaded = $false
          foreach ($url in $mirrors) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Write-Host "[FFMPEG] Downloading portable static Windows x64 archive from $url (attempt $attempt/3)..."
                $headers = @{ "User-Agent" = "dmd-gif-converter-release" }
                if ($url -like "https://github.com/*" -and $env:GH_TOKEN) {
                  $headers["Authorization"] = "Bearer $env:GH_TOKEN"
                }
                Invoke-WebRequest -Uri $url -Headers $headers -OutFile $ffZip -TimeoutSec 120 -MaximumRetryCount 2 -RetryIntervalSec 3
                if ((Test-Path $ffZip) -and ((Get-Item $ffZip).Length -gt 10000000)) {
                  $downloaded = $true
                  break
                }
              } catch {
                Write-Warning "[FFMPEG] Mirror attempt $attempt failed for ${url}: $($_.Exception.Message)"
                Start-Sleep -Seconds (3 * $attempt)
              }
            }
            if ($downloaded) { break }
          }

          if ($downloaded) {
            $extractDir = Join-Path $ffRoot "extracted"
            if (Test-Path $extractDir) { Remove-Item -Recurse -Force $extractDir }
            Expand-Archive -Path $ffZip -DestinationPath $extractDir -Force
            $ffmpegExe = Get-ChildItem -Path $extractDir -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
            $ffprobeExe = Get-ChildItem -Path $extractDir -Filter "ffprobe.exe" -Recurse | Select-Object -First 1
            if (-not $ffmpegExe -or -not $ffprobeExe) {
              throw "Extracted FFmpeg archive did not contain both ffmpeg.exe and ffprobe.exe"
            }
            Copy-Item -Path $ffmpegExe.FullName -Destination (Join-Path $ffBin "ffmpeg.exe") -Force
            Copy-Item -Path $ffprobeExe.FullName -Destination (Join-Path $ffBin "ffprobe.exe") -Force
            Remove-Item -Force $ffZip -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force $extractDir -ErrorAction SilentlyContinue
            "$ffBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:PATH = "$ffBin;$env:PATH"
          } elseif (-not ((Get-Command ffmpeg -ErrorAction SilentlyContinue) -and (Get-Command ffprobe -ErrorAction SilentlyContinue))) {
            Write-Warning "[FFMPEG] Static mirrors unavailable; falling back to Chocolatey..."
            choco install ffmpeg -y --no-progress --execution-timeout=180
          }
          ffmpeg -version
          ffprobe -version

      - name: Install UI & PyInstaller build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install ".[ui]" pyinstaller certifi

      - name: Build standalone Desktop UI & run hermetic out-of-the-box self-test
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          python .github/scripts/build_desktop_ui.py --self-test

      - name: Upload standalone Desktop UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: ${{ matrix.asset_path }}

  release:
    name: Build & Publish Release
    needs: build-desktop-ui
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stamp package version from Git release tag
        run: |
          python - <<'PY'
          import os, re, tomllib
          from pathlib import Path

          ver = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          targets = [
              ("pyproject.toml", r'^version = ".*"', f'version = "{ver}"'),
              ("src/engine/api.py", r'^__version__ = ".*"', f'__version__ = "{ver}"'),
              ("src/ui/constants.py", r'^APP_VERSION\s*=\s*".*"', f'APP_VERSION   = "{ver}"'),
              ("src/ui/models/application_state.py", r'^APP_VERSION\s*=\s*".*"', f'APP_VERSION = "{ver}"'),
          ]
          for rel_path, pattern, repl in targets:
              path = Path(rel_path)
              if path.exists():
                  path.write_text(re.sub(pattern, repl, path.read_text(), count=1, flags=re.M))

          toml_ver = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          api_match = re.search(r'^__version__\s*=\s*"([^"]+)"', Path("src/engine/api.py").read_text(), flags=re.M)
          assert toml_ver == ver and api_match and api_match.group(1) == ver, (
              f"Version stamp mismatch: expected {ver}, got pyproject={toml_ver}, api={api_match.group(1) if api_match else None}"
          )
          print(f"Stamped version from release tag: {ver}")
          PY

      - name: Build Python Wheel and Source Distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Download standalone Desktop UI artifacts (.exe & .dmg)
        uses: actions/download-artifact@v4
        with:
          pattern: dmd-gif-converter-ui-*
          merge-multiple: true
          path: dist/desktop/

      - name: Publish GitHub Release with Wheel & Desktop UI Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/desktop/*.exe
            dist/desktop/*.dmg
          generate_release_notes: true

      - name: Update floating 'latest' Git tag (stable releases only)
        if: "!contains(github.ref_name, '-')"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/engine/api.py src/ui/constants.py src/ui/models/application_state.py
          git commit -m "chore(release): stamp ${GITHUB_REF_NAME}" || true
          git tag -f latest HEAD
          git push origin refs/tags/latest --force
