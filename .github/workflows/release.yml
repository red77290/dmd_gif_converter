name: Release — Build Wheel & Publish GitHub Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package __version__
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER=$(python -c "import src.engine.api as a; print(a.__version__)")
          echo "Tag version: $TAG_VER | Package version: $PKG_VER"
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "Error: git tag ($TAG_VER) does not match __version__ ($PKG_VER)"
            exit 1
          fi

      - name: Build Python Wheel and Source Distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish GitHub Release with Wheel Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
